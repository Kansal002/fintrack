# Netlify configuration — FinTrack is a fully static Next.js export.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Every route is pre-rendered to `<route>/index.html`, so no SPA rewrite is needed
# for known routes. Unknown paths fall through to the exported 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Hashed build assets never change — cache them forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
